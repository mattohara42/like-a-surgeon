name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data tree
        run: node tools/validate.js
      - name: Build release bundle
        run: node tools/bundle.js
      - name: Generate the gate report
        run: node tools/report.js > /dev/null
