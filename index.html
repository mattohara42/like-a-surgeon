<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lineage</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0c10;
    color: #e8e9ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app {
    position: fixed;
    inset: 0;
  }
  .graph-svg {
    display: block;
    cursor: grab;
    touch-action: none;
  }
  .graph-svg.dragging {
    cursor: grabbing;
  }
  .graph-svg:focus {
    outline: none;
  }
  .node {
    cursor: pointer;
  }
  .node-label, .node-hook {
    pointer-events: none;
    user-select: none;
  }
  .edge {
    cursor: pointer;
  }
  #status {
    position: fixed;
    top: 12px;
    left: 12px;
    font-size: 13px;
    color: #9aa0a8;
    pointer-events: none;
  }
  #status.error {
    color: #e06c75;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="status">Loading&hellip;</div>
  <script type="module" src="main.js"></script>
</body>
</html>
